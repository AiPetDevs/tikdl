<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Паспорт приложения</title>
<!-- Template for passport/view.html. scripts/passport.mjs build puts the passport data in place of the marker below. -->
<style>
:root{--bg:#161616;--surface:#202020;--surface-2:#2a2a2a;--line:#3a3a3a;--line-strong:#8c8c8c;--edge:#6e6e6e;--edge-on:#d0d0d0;--text:#ececec;--dim:#b4b4b4;--accent:#6cb2ff;--sel:#1d3048;--ok:#8fd19a;--bad:#ff9a8f;--warn:#f0c674;
--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,"JetBrains Mono",monospace;--r:4px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--font)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:8px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.brand{font-weight:600;font-size:16px}.dim{color:var(--dim)}.mono{font-family:var(--mono);font-size:12px}
nav{display:flex;gap:16px}
nav button{background:none;border:0;border-bottom:2px solid transparent;min-height:44px;padding:0 2px;color:var(--dim);cursor:pointer}
nav button[aria-pressed=true]{color:var(--text);font-weight:600;border-bottom-color:var(--accent)}
.status{margin-left:auto;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--dim)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
main{padding:24px;max-width:1600px;margin:0 auto}
.split{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.grow{flex:999 1 640px;min-width:0}.side{flex:1 1 340px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
h1{font-size:20px;font-weight:600;margin:0}h2{font-size:18px;font-weight:600;margin:0}h3{font-size:12px;font-weight:600;color:var(--dim);margin:0 0 4px}
.sec{padding-top:12px;margin-top:12px;border-top:1px solid var(--line)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:12px}
select{background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:var(--r);min-height:36px;padding:0 8px}
.mapbox{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
svg text{font-family:var(--font)}
.node rect{fill:var(--surface-2);stroke:var(--line);stroke-width:1}
.node{cursor:pointer}
.node.near rect{stroke:var(--line-strong)}
.node.on rect{fill:var(--sel);stroke:var(--accent);stroke-width:1.5}
.node.path rect{stroke:var(--accent);stroke-width:1.5}
.node.dimmed{opacity:.35}
.node .t{fill:var(--text);font-size:13px;font-weight:600}.node .s{fill:var(--dim);font-size:11px;font-family:var(--mono)}
.node.ext rect{stroke-dasharray:4 3}
.edge{fill:none;stroke:var(--edge);stroke-width:1.2}
.edge.on{stroke:var(--edge-on);stroke-width:1.8}
.edge.path{stroke:var(--accent);stroke-width:2.2}
.edge.dimmed{opacity:.15}
.lane{fill:#1b1b1b}.lanet{fill:var(--dim);font-size:12px}
.list{display:flex;flex-direction:column;gap:8px}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:52px;padding:8px 12px;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.pick[aria-pressed=true]{background:var(--sel);border-color:var(--accent)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:12px;padding:8px 12px;background:var(--surface-2);border-radius:var(--r)}
.steps .n{flex:0 0 22px;font-family:var(--mono);color:var(--dim)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:var(--r);padding:0 6px;font-size:12px;color:var(--dim)}
button.chip{cursor:pointer;background:none;min-height:24px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;vertical-align:top;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--dim);font-weight:600}
.tablebox{overflow-x:auto}
pre{white-space:pre-wrap;font:12px/1.6 var(--mono);margin:0}
.row{display:flex;flex-wrap:wrap;gap:0 8px}
.facts{display:flex;flex-wrap:wrap;gap:12px 24px}.facts>div{flex:1 1 200px;min-width:0}
.hidden{display:none}
ul.plain{margin:0;padding-left:18px}
</style>
</head>
<body>
<header>
  <span class="brand" id="app"></span>
  <span class="dim" id="sum"></span>
  <nav aria-label="Разделы паспорта" id="nav"></nav>
  <div class="status" id="status"></div>
</header>
<main id="main"></main>

    sec('Типовые сбои', ...((c.failures || []).length ? c.failures.map(f => $('div', { class: 'sec' }, $('b', { text: f.symptom }), $('div', { class: 'dim', text: `причина: ${f.cause}` }), $('div', { text: `где смотреть: ${f.look}` }), ...(f.refs || []).map(r => $('div', { class: 'mono', text: ref(r) })))) : [$('div', { class: 'dim', text: '—' })])),
    sec('Как отделить', $('div', { text: c.isolate || '—' })),
    sec('Участвует в функциях', ...(feats.length ? feats.map(f => $('button', { type: 'button', class: 'chip', text: f.name, onclick: () => { state.tab = 'features'; state.fsel = f.id; render(); } })) : [$('div', { class: 'dim', text: '—' })])),
    sec('Карточка', $('div', { class: 'mono', text: c.file })));
}

// ---------------------------------------------------------------- features
function featSteps(f, compact) {
  return $('div', { class: compact ? 'panel sec' : 'sec' }, $('h3', { text: compact ? `Путь: ${f.name}` : 'Путь выполнения: компонент — что происходит — где в коде' }),
    $('ol', { class: 'steps' }, ...f.steps.map((s, i) => $('li', {}, $('span', { class: 'n', text: String(i + 1) }),
      $('div', {}, $('div', {}, $('b', { text: comp(s.comp)?.name || s.comp }), ` — ${s.does}`), ...(s.at || []).map(r => $('div', { class: 'mono dim', text: ref(r) })))))));
}
function renderFeatures() {
  const f = D.feats.find(x => x.id === state.fsel) || D.feats[0];
  if (!f) return $('div', { class: 'panel' }, $('h1', { text: 'Функций пока нет' }), $('p', { class: 'dim', text: 'Карточки функций — passport/features/<id>.json, образец — _example.json.' }));
  const cfg = (f.config || []).map(id => { const x = (D.config?.items || []).find(c => c.id === id); return x ? `${id} = ${x.default} — ${x.effect}` : id; });
  return $('div', { class: 'split' },
    $('section', { class: 'side', 'aria-label': 'Список функций' }, $('h1', { text: 'Функции' }), $('p', { class: 'dim', text: 'Одна карточка — одно действие пользователя от нажатия до результата.' }),
      $('div', { class: 'list' }, ...D.feats.map(x => $('button', { type: 'button', class: 'pick', 'aria-pressed': String(x.id === f.id), onclick: () => { state.fsel = x.id; render(); } }, $('b', { text: x.name }), $('span', { class: 'mono dim', text: x.id }))))),
    $('article', { class: 'grow panel' },
      $('h2', { text: f.name }), $('div', { class: 'mono dim', text: f.id }), $('p', { text: f.user }),
      $('div', { class: 'facts sec' }, ...[['Запуск', f.trigger], ['Вход', f.input], ['Результат', f.output]].map(([t, v]) => $('div', {}, $('h3', { text: t }), $('div', { text: v || '—' })))),
      featSteps(f),
      $('div', { class: 'facts sec' }, $('div', {}, $('h3', { text: 'Данные' }), $('div', { text: `читает: ${f.reads || '—'}` }), $('div', { text: `пишет: ${f.writes || '—'}` })),
        $('div', {}, $('h3', { text: 'Настройки, которые влияют' }), ...lines(cfg, true))),
      sec('Ошибки: когда — что видит пользователь — где', ...((f.errors || []).length ? f.errors.map(e => $('div', { class: 'row' }, $('span', { text: e.when }), $('span', { class: 'dim', text: `→ ${e.shows}` }), ...(e.at || []).map(r => $('span', { class: 'mono', text: ref(r) })))) : [$('div', { class: 'dim', text: '—' })])),
      sec('Проверка', $('div', { text: f.verify }), ...(f.tests || []).map(t => $('div', { class: 'mono dim', text: `тест ${ref(t)}` }))),
      $('div', { class: 'sec row' }, $('button', { type: 'button', class: 'chip', text: 'Показать путь на карте', onclick: () => { state.tab = 'map'; state.feat = f.id; state.sel = f.steps[0].comp; render(); } }), $('span', { class: 'mono dim', text: f.file }))));
}

// ---------------------------------------------------------------- data & config
const table = (head, rows) => $('div', { class: 'tablebox' }, $('table', {}, $('thead', {}, $('tr', {}, ...head.map(h => $('th', { text: h })))), $('tbody', {}, ...rows.map(r => $('tr', {}, ...r.map(v => $('td', {}, v)))))));
function renderData() {
  const di = D.data?.items || [], ci = D.config?.items || [];
  return $('div', { class: 'list' },
    $('section', { class: 'panel' }, $('h1', { text: 'Данные' }), D.pass.dataDir ? $('p', { class: 'dim', text: 'Папка данных: ' + Object.entries(D.pass.dataDir).filter(([k]) => k !== 'code').map(([k, v]) => `${k} ${v}`).join(' · ') }) : null,
      table(['Что', 'Содержимое', 'Формат', 'Пишет', 'Читает', 'Код', 'Заметка'], di.map(x => [$('span', { class: 'mono', text: x.id }), x.what, `${x.format}${x.perm ? ', ' + x.perm : ''}`, comp(x.writer)?.name || x.writer, (x.readers || []).map(r => comp(r)?.name || r).join(', '), $('span', { class: 'mono', text: (x.at || []).map(ref).join('\n') }), x.note || '']))),
    $('section', { class: 'panel' }, $('h1', { text: 'Настройки и постоянные' }),
      table(['Имя', 'Вид', 'По умолчанию', 'На что влияет', 'Кто читает', 'Код'], ci.map(x => [$('span', { class: 'mono', text: x.id }), x.kind, x.default, x.effect, comp(x.who)?.name || x.who, $('span', { class: 'mono', text: (x.at || []).map(ref).join('\n') })]))),
    $('section', { class: 'panel' }, $('h1', { text: 'Что нельзя нарушать во всём приложении' }), $('ul', { class: 'plain' }, ...(D.pass.invariants || []).map(t => $('li', { text: t })))),
    $('section', { class: 'panel' }, $('h1', { text: 'Решения и история' }), table(['Что', 'Где'], (D.pass.decisions || []).map(d => [d.title, $('span', { class: 'mono', text: d.ref })]))));
}

// ---------------------------------------------------------------- agent
function renderAgent() {
  const exSym = (Object.keys(D.symbols).find(k => /#\w/.test(k) && D.symbols[k].component) || '#<символ>').split('#')[1];
  const run = Object.entries(D.pass.run || {}).map(([k, v]) => [k, $('span', { class: 'mono', text: v })]);
  const checks = Object.entries(D.pass.checks || {}).map(([k, v]) => [k, $('span', { class: 'mono', text: v })]);
  return $('div', { class: 'split' },
    $('section', { class: 'grow list' },
      $('div', { class: 'panel' }, $('h1', { text: 'Вопросы к карте из консоли' }), $('p', { class: 'dim', text: 'Агенту не нужно читать код подряд: сначала спросить карту, потом открыть нужные строки.' }),
        table(['Вопрос', 'Команда'], [
          ['Что это и где? Кто вызывает, что вызывает, в каких функциях', $('span', { class: 'mono', text: `node scripts/passport.mjs where ${exSym}` })],
          ['Что сломается, если поменять', $('span', { class: 'mono', text: `node scripts/passport.mjs impact ${exSym}` })],
          ['Всё о компоненте', $('span', { class: 'mono', text: `node scripts/passport.mjs where ${D.comps[0]?.id || '<компонент>'}` })],
          ['Путь функции по символам', $('span', { class: 'mono', text: `node scripts/passport.mjs where ${D.feats[0]?.id || 'feature.<id>'}` })],
          ['Сверить карту с кодом', $('span', { class: 'mono', text: 'node scripts/passport.mjs check' })],
          ['Пересобрать индекс после правки', $('span', { class: 'mono', text: 'node scripts/passport.mjs build' })]])),
      D.commands.length ? $('div', { class: 'panel' }, $('h1', { text: 'Команды Tauri: кто вызывает ↔ где в Rust' }),
        table(['Вызов', 'Команда', 'Компонент', 'Где'], D.commands.map(c => [$('span', { class: 'mono', text: c.via ? ref(c.via) : '— (не вызывается)' }), $('span', { class: 'mono', text: c.name }), comp(c.component)?.name || c.component, $('span', { class: 'mono', text: ref(c.at) })]))) : null,
      D.events.length ? $('div', { class: 'panel' }, $('h1', { text: 'События Rust → окно' }),
        table(['Событие', 'Отправляет', 'Слушает'], D.events.map(e => [$('span', { class: 'mono', text: e.event }), $('span', { class: 'mono', text: e.emitted.join('\n') }), $('span', { class: 'mono', text: e.listened.join('\n') || '—' })]))) : null,
      (D.routes || []).length ? $('div', { class: 'panel' }, $('h1', { text: 'HTTP-маршруты' }),
        table(['Маршрут', 'Обработчик', 'Компонент'], D.routes.map(r => [$('span', { class: 'mono', text: r.route }), $('span', { class: 'mono', text: ref(r.at) }), comp(r.component)?.name || r.component]))) : null,
      $('div', { class: 'panel' }, $('h1', { text: 'Запуск и проверки' }), table(['Что', 'Команда'], [...run, ...checks]))),
    $('aside', { class: 'side list' },
      $('div', { class: 'panel' }, $('h2', { text: 'Плейбуки' }), $('ul', { class: 'plain mono' }, ...(D.ops || []).map(t => $('li', { text: `passport/ops/${t}` })))),
      $('div', { class: 'panel' }, $('h2', { text: 'AGENTS.md / CLAUDE.md' }), $('pre', { text: D.agents || '—' }))));
}

// ---------------------------------------------------------------- check
function renderCheck() {
  return $('div', { class: 'list' },
    $('section', { class: 'panel' }, $('h1', { text: 'Сверка карты с кодом' }),
      $('p', { class: 'dim', text: 'Результат на момент сборки страницы. Текущее состояние — node scripts/passport.mjs check.' }),
      table(['Показатель', 'Значение'], [['Файлов кода', String(st.files)], ['Символов', String(st.symbols)], ['Вызовов (по именам)', String(st.edges)], ['Компонентов', String(D.comps.length)], ['Функций', String(D.feats.length)], ['Коммит', st.commit || '—'], ['Отпечаток кода', st.sourceHash]])),
    $('section', { class: 'panel' }, $('h2', { class: ck.errors.length ? 'bad' : 'ok', text: ck.errors.length ? `Ошибки: ${ck.errors.length}` : 'Ошибок нет' }), ...lines(ck.errors)),
    $('section', { class: 'panel' }, $('h2', { class: 'warn', text: `Предупреждения: ${ck.warns.length}` }), ...lines(ck.warns)),
    $('section', { class: 'panel' }, $('h2', { text: 'Что проверяется' }), $('ul', { class: 'plain' }, ...[
      'Формат: у каждой карточки есть обязательные поля, слои и id известны.',
      'Привязки: каждый файл и символ, названный в карточках, есть в коде; шаг функции отнесён к компоненту, которому принадлежит его символ.',
      'Покрытие: каждый файл кода принадлежит ровно одному компоненту; если файл поделён — каждый его символ.',
      'Границы: каждая связь между компонентами, найденная в коде (вызовы, импорты, invoke, события, регистрация команд), объявлена в uses.',
      'Адаптеры: команды и события Tauri согласованы с обеих сторон (если в проекте есть Tauri).',
      'Свежесть: индекс собран на текущем коде (отпечаток содержимого, а не только коммит).'].map(t => $('li', { text: t })))));
}

function render() {
  if (!comp(state.sel)) state.sel = D.comps[0].id;
  renderNav();
  const view = { map: renderMap, features: renderFeatures, data: renderData, agent: renderAgent, check: renderCheck }[state.tab]();
  document.getElementById('main').replaceChildren(view);
}
render();
</script>
</body>
