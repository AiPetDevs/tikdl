# Link landing page for messengers: https://<owner>.github.io/<repo>/get/#<ticket> opens tikdl://get/<ticket>.
# Enable once: repository Settings → Pages → Source: GitHub Actions.
name: pages
on:
  push:
    branches: [main]
    paths: ['ui/site/**', 'ui/tokens.css', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p _site && cp -R ui/site/. _site/ && cp ui/tokens.css _site/tokens.css && printf "<meta http-equiv=refresh content=\"0;url=get/\">" > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
