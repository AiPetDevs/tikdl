name: build

on:
  push:
    tags: ["v*"]
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# Release step uploads assets to a GitHub Release — needs write access to repo contents.
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Passport matches the code
        run: node scripts/passport.mjs check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Clippy
        working-directory: src-tauri
        # Warnings are reported but not fatal yet; switch to `-- -D warnings` once the tree is clean.
        run: cargo clippy --locked --all-targets

  build:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          # One .dmg for both Apple Silicon and Intel (macos-13 runners are retired).
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: ""
            rust_targets: ""
            bundles: nsis
          - os: ubuntu-22.04
            target: ""
            rust_targets: ""
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # cache-bin (default) keeps the installed tauri-cli between runs, so the install step is a no-op.
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build
        working-directory: src-tauri
        shell: bash
        env:
          # https link for messengers → the landing page published by pages.yml
          TIKDL_LINK_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/get/
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          else
            cargo tauri build --bundles ${{ matrix.bundles }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tikdl-${{ matrix.os }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
