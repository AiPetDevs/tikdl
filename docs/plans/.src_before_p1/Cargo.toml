[package]
name = "tikdl"
version = "0.1.0"
edition = "2021"
description = "Скачивание и раздача файлов по iroh-тикету"

[[bin]]
name = "tikdl"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
dirs = "6"
futures-lite = "2"
iroh = "1.5"
iroh-blobs = "0.105"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["full"] }
urlencoding = "2"
walkdir = "2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
