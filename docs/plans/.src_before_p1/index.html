<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikDL</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --muted:#6b7280; --accent:#2f6df6; --ok:#16a34a; --err:#dc2626; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161b; --card:#1d2027; --fg:#e8eaf0; --muted:#9aa1ad; --line:#2c3039; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:560px; margin:0 auto; padding:20px; }
  h1 { font-size:20px; margin:0 0 14px; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; }
  .tabs button { flex:1; background:var(--card); color:var(--fg); border:1px solid var(--line); }
  .tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  textarea, input { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--fg); font:inherit; }
  textarea { height:84px; resize:vertical; font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  button { padding:10px 14px; border-radius:8px; border:0; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; align-items:center; margin-top:10px; }
  .row input { flex:1; }
  .muted { color:var(--muted); font-size:13px; }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin:10px 0 6px; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .25s; }
  .done .bar > div { background:var(--ok); }
  .err { color:var(--err); }
  .name { font-weight:600; word-break:break-all; }
  .hidden { display:none; }
  .confirm { border-color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>TikDL</h1>
  <div class="tabs">
    <button id="tabGet" class="on">Скачать</button>
    <button id="tabShare">Раздать</button>
  </div>

  <section id="pGet">
    <div class="card confirm hidden" id="confirm" role="alertdialog" aria-labelledby="cfTitle">
      <div class="muted" id="cfTitle">Пришла ссылка на скачивание. Скачать?</div>
      <div class="name" id="cfName"></div>
      <div class="muted" id="cfMeta"></div>
      <div class="row">
        <button id="cfYes" style="flex:1">Скачать</button>
        <button class="ghost" id="cfNo">Отмена</button>
      </div>
    </div>
    <div class="card">
      <div class="muted">Вставьте ссылку или тикет, который вам прислали</div>
      <textarea id="link" placeholder="tikdl://get/blob…"></textarea>
      <div class="row">
        <input id="dest" readonly>
        <button class="ghost" id="pick">Папка…</button>
      </div>
      <div class="row"><button id="go" style="flex:1">Скачать</button></div>
      <div id="linkErr" class="err muted"></div>
    </div>
    <div id="jobs"></div>
  </section>

  <section id="pShare" class="hidden">
    <div class="card">
      <div class="muted">Выберите файл или папку. Пока приложение открыто, их можно скачать по ссылке.</div>
      <div class="row">
        <button id="shFile" style="flex:1">Файл…</button>
        <button id="shDir" style="flex:1">Папку…</button>
      </div>
      <div id="shStatus" class="muted" style="margin-top:10px"></div>
    </div>
    <div id="shares"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
